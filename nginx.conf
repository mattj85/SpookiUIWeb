server {
    listen       80;
    listen       [::]:80;

    # Respond to the public hostname (and localhost for health checks / testing).
    # A reverse proxy / TLS terminator is expected to sit in front of this.
    server_name  spookiui.rooksnet.uk localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text assets on the fly.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # Hashed build assets never change — cache them hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA: always fall back to index.html so deep links resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
